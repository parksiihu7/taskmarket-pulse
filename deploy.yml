name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # every 30 minutes; the page shows the build time as "data as of"
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the market data
        run: python3 scripts/fetch_data.py

      - name: Check the data before deploying
        run: python3 scripts/check_data.py site/data/market.json

      - uses: actions/configure-pages@v5
        with:
          # enables Pages with "GitHub Actions" as the source on the first run, so a
          # fresh repo needs no manual settings step
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
